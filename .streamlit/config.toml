[theme]
base = "dark"
primaryColor = "#B7F34A"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#151D30"
textColor = "#F4F7FB"


[server]
enableStaticServing = true
# Phones drop the live connection when you switch apps. Keep the visit for 30 minutes (default 2) so
# coming back resumes where you were; after that, the remember-me cookie signs you back in.
disconnectedSessionTTL = 1800

