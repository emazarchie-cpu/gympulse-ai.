# Monday WhatsApp to gym owners with the members to call this week.
# Every Monday at 06:47 UTC (07:47 Lagos). Uses the same repository secrets as Automatic messages.
name: Monday owner WhatsApp

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would be sent, send nothing"
        type: boolean
        default: true

concurrency:
  group: owner-weekly
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python scripts/send_owner_weekly.py $ARGS
